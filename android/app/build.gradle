plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    compileSdk 36

    namespace "com.example.jarvis_core"
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        targetSdk 36
        minSdk 21

        applicationId "com.example.jarvis_core"
        minSdk 21
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

tasks.whenTaskAdded { task ->
    if (task.name.contains('checkDebugMetadata') || task.name.contains('checkReleaseMetadata')) {
        task.enabled = false
    }
}
